# ============================================================
# 企开得胜 - 专利驱动的产业大脑与精准招商平台
# 中间件 Docker 编排（5 容器）：MySQL / Redis / ES / Neo4j / MinIO
#
# 单一配置源：端口与口令全部由根目录 .env 驱动（.env 不入库）。
# 数据卷说明（重要）：
#   - mysql_data / neo4j_logs 为外部哈希卷：本文件与运行中容器 1:1 对齐，
#     重新 up 只会重建容器、不会重建/清空数据卷，32.9 万企业数据安全。
#   - 若在新机器全新初始化：删除下面两个 external 卷声明、改回普通命名卷即可
#     （initdb 脚本在首启时自动执行 sql/init.sql + migrations/）。
# ============================================================

name: industry-brain

networks:
  industry_brain_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql_data:
    external: true
    name: d857d9ec26707213e83ef07a2dce03860842b89d6f5f79a0413c6282c2e08e3b
  neo4j_logs:
    external: true
    name: 2f0a06621e735a0f0bcc9e9b4dee1353de2f6901bc55e2286468827076ca9376
  redis_data:
  es_data:
  neo4j_data:
  minio_data:

services:

  # ─── 1. MySQL 8.0（宿主端口 .env: MYSQL_HOST_PORT=13307）───
  mysql:
    image: mysql:8.0.34
    container_name: industry_brain_mysql
    restart: unless-stopped
    networks:
      industry_brain_net:
        ipv4_address: 172.20.0.2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: industry_brain
    ports:
      - "${MYSQL_HOST_PORT:-13307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./config/my-custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. Redis 7（宿主端口 .env: REDIS_HOST_PORT=6379）───
  redis:
    image: redis:7-alpine
    container_name: industry_brain_redis
    restart: unless-stopped
    networks:
      industry_brain_net:
        ipv4_address: 172.20.0.3
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 3. Elasticsearch 8.11（宿主端口 .env: 9200/9300）───
  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: industry_brain_es
    restart: unless-stopped
    networks:
      industry_brain_net:
        ipv4_address: 172.20.0.4
    environment:
      - cluster.name=industry-brain
      - node.name=es-node-1
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - http.host=0.0.0.0
      - network.host=0.0.0.0
    ports:
      - "${ES_HOST_PORT:-9200}:9200"
      - "${ES_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── 4. Neo4j 5（宿主端口 .env: 7687 bolt / 7474 http）───
  neo4j:
    image: neo4j:5.20.0-community
    container_name: industry_brain_neo4j
    restart: unless-stopped
    networks:
      industry_brain_net:
        ipv4_address: 172.20.0.5
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/neo4j123}
      - NEO4J_dbms_memory_pagecache_size=256M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=512M
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
      - NEO4J_dbms_connector_bolt_advertised__address=172.20.0.5:7687
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_data:/var/lib/neo4j/import
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── 5. MinIO（宿主端口 .env: 9000 API / 9001 控制台）───
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: industry_brain_minio
    restart: unless-stopped
    networks:
      industry_brain_net:
        ipv4_address: 172.20.0.6
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BROWSER=on
      - MINIO_PUBLIC_ACCESS=true
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
      - minio_data:/root/.minio
    command: server /data --console-address ":9001"
    healthcheck:
      # minio 官方镜像无 curl, 用自带的 mc 探活（与运行态一致）
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
