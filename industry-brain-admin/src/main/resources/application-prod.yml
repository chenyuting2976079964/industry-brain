# ==========================================
# 产业链智能分析与招商推荐平台
# 生产环境配置
# ==========================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/industry_brain?useUnicode=true&characterEncoding=utf8&zeroDateTimePolicy=convertToNull&useSSL=false&serverTimezone=GMT%2B8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 30
      idle-timeout: 600000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 200
        max-idle: 20
        min-idle: 5

mybatis:
  mapper-locations: classpath:mapper/mysql/*.xml
  type-aliases-package: com.industrybrain.domain
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:industry-brain-jwt-secret-2024}
  expiration: ${JWT_EXPIRATION:604800}

elasticsearch:
  host: ${ELASTICSEARCH_HOST:elasticsearch}
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: http

neo4j:
  uri: ${NEO4J_URI:bolt://neo4j:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD:neo4j123}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket-name: ${MINIO_BUCKET_NAME:industry-brain}

# 向量嵌入（自动聚类构建产业链用；enabled=false 走纯规则聚类降级）
embedding:
  enabled: ${EMBEDDING_ENABLED:false}
  base-url: ${EMBEDDING_BASE_URL:http://localhost:8000}
  api-key: ${EMBEDDING_API_KEY:}
  model: ${EMBEDDING_MODEL:text-embedding-3-small}
  dimension: ${EMBEDDING_DIMENSION:1536}
  batch-size: 16
  timeout-ms: 15000
  max-retries: 2
  retry-backoff-ms: 500
  cluster-threshold: 0.42
  vector-weight: 0.7
  rule-weight: 0.3
  description-limit: 5

logging:
  level:
    com.industrybrain: info
    org.springframework: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: /var/log/industry-brain/industry-brain.log
