# ==========================================
# 产业智能分析与招商推荐平台
# 开发环境配置（对接 Docker 中间件）
# ==========================================

server:
  port: ${SERVER_PORT:8890}
  servlet:
    context-path: /

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13307}/industry_brain?useUnicode=true&characterEncoding=utf8&zeroDateTimePolicy=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 200
        max-idle: 20
        min-idle: 5
  neo4j:
    uri: ${NEO4J_URI:bolt://127.0.0.1:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j123}

redis:
  enabled: true

mybatis:
  mapper-locations: classpath:mapper/mysql/*.xml
  type-aliases-package: com.industrybrain.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET:industry-brain-secret-key-2024}
  expiration: ${JWT_EXPIRATION:604800}

elasticsearch:
  enabled: true
  host: ${ELASTICSEARCH_HOST:127.0.0.1}
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: http

neo4j:
  enabled: true
  uri: ${NEO4J_URI:bolt://127.0.0.1:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD:neo4j123}

minio:
  enabled: true
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket-name: ${MINIO_BUCKET_NAME:default}
  report-bucket: ${MINIO_REPORT_BUCKET:reports}
  attachment-bucket: ${MINIO_ATTACH_BUCKET:attachments}
  data-import-bucket: ${MINIO_IMPORT_BUCKET:data-import}

# 向量嵌入（自动聚类构建产业链用；enabled=false 走纯规则聚类降级）
embedding:
  enabled: ${EMBEDDING_ENABLED:true}
  base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${EMBEDDING_API_KEY:sk-wsffznbtsdfbulrbjzjnptanrbebykwajglmpfxwrejoboaq}
  model: ${EMBEDDING_MODEL:BAAI/bge-m3}
  dimension: ${EMBEDDING_DIMENSION:512}
  batch-size: 16
  timeout-ms: 15000
  max-retries: 2
  retry-backoff-ms: 500
  cluster-threshold: 0.42
  vector-weight: 0.7
  rule-weight: 0.3
  description-limit: 5

logging:
  level:
    com.industrybrain: debug
    org.springframework: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

# ==========================================
# LLM 大模型配置（用于报告分析增强）
# 复用 SiliconFlow OpenAI 兼容接口
# ==========================================
llm:
  enabled: ${LLM_ENABLED:true}
  base-url: ${LLM_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${LLM_API_KEY:sk-wsffznbtsdfbulrbjzjnptanrbebykwajglmpfxwrejoboaq}
  model: ${LLM_MODEL:deepseek-ai/DeepSeek-V3}
  max-tokens: ${LLM_MAX_TOKENS:2000}
  temperature: ${LLM_TEMPERATURE:0.3}
  timeout-ms: ${LLM_TIMEOUT_MS:30000}
  max-retries: ${LLM_MAX_RETRIES:2}
  retry-backoff-ms: ${LLM_RETRY_BACKOFF_MS:500}