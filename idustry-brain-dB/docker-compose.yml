# ============================================================
# 产业大脑平台 - 全部中间件 Docker 编排
# 所有服务均开放远程访问，支持共用数据库
# ============================================================

name: industry-brain

networks:
  industry_brain_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql_data:
  redis_data:
  es_data:
  neo4j_data:
  minio_data:

services:

  # ─── 1. MySQL 8.0 ───
  mysql:
    image: mysql:8.0.34
    container_name: industry_brain_mysql
    restart: unless-stopped
    networks:
      industry_brain_net:
        ipv4_address: 172.20.0.2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: industry_brain
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
      - ./config/my-custom.cnf:/etc/mysql/conf.d/custom.cnf
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. Redis 7 ───
  redis:
    image: redis:7-alpine
    container_name: industry_brain_redis
    restart: unless-stopped
    networks:
      industry_brain_net:
        ipv4_address: 172.20.0.3
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 3. Elasticsearch 8.11 ───
  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: industry_brain_es
    restart: unless-stopped
    networks:
      industry_brain_net:
        ipv4_address: 172.20.0.4
    environment:
      - cluster.name=industry-brain
      - node.name=es-node-1
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - http.host=0.0.0.0
      - network.host=0.0.0.0
    ports:
      - "${ES_HOST_PORT:-9200}:9200"
      - "${ES_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── 4. Neo4j 5 ───
  neo4j:
    image: neo4j:5.20.0-community
    container_name: industry_brain_neo4j
    restart: unless-stopped
    networks:
      industry_brain_net:
        ipv4_address: 172.20.0.5
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/neo4j123}
      - NEO4J_dbms_memory_pagecache_size=256M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=512M
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
      - NEO4J_dbms_connector_bolt_advertised__address=172.20.0.5:7687
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_data:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── 5. MinIO ───
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: industry_brain_minio
    restart: unless-stopped
    networks:
      industry_brain_net:
        ipv4_address: 172.20.0.6
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BROWSER=on
      - MINIO_PUBLIC_ACCESS=true
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
      - minio_data:/root/.minio
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
